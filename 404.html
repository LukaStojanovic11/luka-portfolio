<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable · Luka Stojanovic</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F6F4EF">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F6F4EF;--ink:#211D16;--muted:#7A756C;--rust:#2E5A3C;--rust-deep:#23462F;--cream:#F7F5F0}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif}
  main{max-width:560px;text-align:center}
  .code{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(88px,22vw,160px);line-height:.9;letter-spacing:-.04em;color:var(--rust);margin:0}
  h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em;margin:16px 0 8px}
  p{color:var(--muted);font-size:17px;line-height:1.55;margin:0 0 32px}
  a{display:inline-flex;align-items:center;gap:8px;padding:14px 24px;border-radius:999px;background:var(--rust);color:var(--cream);font-weight:600;text-decoration:none;transition:background .2s}
  a:hover{background:var(--rust-deep)}
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Cette page n’existe pas.</h1>
  <p>Le lien est peut-être erroné, ou la page a été déplacée.</p>
  <a href="/">Retour au portfolio <span aria-hidden="true">→</span></a>
</main>
</body>
</html>
